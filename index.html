<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Visualizador Pro - Cálculos e Imagem</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.js"></script>
    
    <style>
        :root { --edge-bg: #323639; }
        body { margin: 0; background-color: #525659; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        .toolbar { 
            height: 48px; background: var(--edge-bg); display: flex; 
            align-items: center; padding: 0 20px; color: white; box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            position: relative; z-index: 10;
        }
        #viewerContainer { position: absolute; top: 48px; bottom: 0; left: 0; right: 0; overflow: auto; }
        .pdfViewer .page { margin: 15px auto; border: none; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        
        /* Estilo para garantir que campos de botão (imagem) pareçam clicáveis */
        .annotationLayer .buttonWidgetAnnotation.pushButton { cursor: pointer !important; }
    </style>
</head>
<body>

    <div class="toolbar">
        <input type="file" id="file-input" accept="application/pdf" style="display:none">
        <button onclick="document.getElementById('file-input').click()" style="background:#0078d4; color:white; border:none; padding:8px 15px; border-radius:4px; cursor:pointer;">📂 Abrir Ficha</button>
        <span id="status" style="margin-left:15px; font-size:13px;">Aguardando arquivo...</span>
    </div>

    <input type="file" id="img-selector" accept="image/*" style="display:none">

    <div id="viewerContainer">
        <div id="viewer" class="pdfViewer"></div>
    </div>

    <script>
        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        const pdfjsViewer = window['pdfjs-dist/web/pdf_viewer'];
        
        // Caminho para o Worker e para o motor de Scripting (Essencial para os cálculos)
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        const sandboxBundleSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.sandbox.external.min.js';

        const eventBus = new pdfjsViewer.EventBus();

        // Inicializa o visualizador com suporte a Scripts (Cálculos)
        const pdfViewer = new pdfjsViewer.PDFViewer({
            container: document.getElementById('viewerContainer'),
            eventBus: eventBus,
            renderInteractiveForms: true,
            enableScripting: true, // Habilita o motor de cálculo
            sandboxBundleSrc: sandboxBundleSrc
        });

        document.getElementById('file-input').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('status').innerText = "Carregando: " + file.name;
            const arrayBuffer = await file.arrayBuffer();
            const loadingTask = pdfjsLib.getDocument({
                data: arrayBuffer,
                enableJavaScript: true // Permite a execução do JS interno do PDF
            });
            
            const pdfDocument = await loadingTask.promise;
            pdfViewer.setDocument(pdfDocument);
        });

        // LÓGICA PARA O CAMPO DE IMAGEM
        // Como o PDF.js renderiza campos de imagem como botões, 
        // precisamos interceptar o clique na camada de anotação.
        
        document.getElementById('viewerContainer').addEventListener('click', (e) => {
            // Verifica se o elemento clicado é um campo de formulário (Widget)
            const target = e.target;
            if (target.classList.contains('buttonWidgetAnnotation') || target.closest('.buttonWidgetAnnotation')) {
                console.log("Campo de imagem/botão detectado!");
                // Abre o seletor de arquivos do navegador
                document.getElementById('img-selector').click();
            }
        });

        document.getElementById('img-selector').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                alert("Imagem selecionada: " + file.name + "\n\nNota: Para que a imagem apareça visualmente 'dentro' do campo agora, precisamos usar a biblioteca PDF-LIB para redesenhar o PDF, pois o motor nativo do navegador apenas visualiza, ele não edita o conteúdo binário em tempo real.");
                // Aqui entraria a lógica de PDF-Lib para inserir a imagem na coordenada do campo
            }
        });

    </script>
</body>
</html>
