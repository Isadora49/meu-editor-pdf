<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Visualizador Pro - Cálculos e Imagem</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    
    <style>
        /* GARANTIA DE VISIBILIDADE: O PDF não some com estas regras */
        html, body { height: 100%; margin: 0; padding: 0; background-color: #525659; overflow: hidden; }
        
        .toolbar { 
            position: absolute; top: 0; left: 0; right: 0; height: 56px; 
            background: #202124; display: flex; align-items: center; 
            padding: 0 20px; color: white; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.5); 
        }
        
        /* O Container ocupa todo o resto da tela abaixo da barra */
        #viewerContainer { 
            position: absolute; top: 56px; bottom: 30px; left: 0; right: 0; 
            overflow: auto; background: #525659;
        }
        
        .pdfViewer .page { 
            border: none; margin: 15px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.6); position: relative; 
        }

        .btn { 
            background: #8ab4f8; color: #202124; border: none; padding: 10px 18px; 
            border-radius: 4px; cursor: pointer; font-weight: bold; margin-right: 15px; 
        }

        .instant-img { position: absolute; z-index: 99; object-fit: cover; pointer-events: none; }
        
        #status-bar { 
            position: absolute; bottom: 0; left: 0; right: 0; height: 30px;
            background: #1a1b1c; color: #9aa0a6; font-size: 12px; display: flex; align-items: center; padding: 0 20px;
        }
    </style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="file-input" accept="application/pdf" style="display:none">
    <button class="btn" onclick="document.getElementById('file-input').click()">📂 Abrir sua Ficha</button>
    <button class="btn" id="save-btn" style="display:none; background: #81c995;">💾 Baixar PDF Final</button>
    <span id="file-info" style="font-size: 13px;">Aguardando arquivo...</span>
</div>

<input type="file" id="img-selector" accept="image/*" style="display:none">

<div id="viewerContainer">
    <div id="viewer" class="pdfViewer"></div>
</div>

<div id="status-bar">Status do Motor: <span id="js-status" style="margin-left:5px; color: #ffab00;">Inativo</span></div>

<script>
    const pdfjsLib = window['pdfjs-dist/build/pdf'];
    const pdfjsViewer = window['pdfjs-dist/web/pdf_viewer'];

    // Caminhos para os Workers e Motor de Cálculo (QuickJS)
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const sandboxBundleSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.sandbox.external.min.js';

    let currentPdfBytes = null;
    let imagesToProcess = [];
    let lastClickedField = null;

    const eventBus = new pdfjsViewer.EventBus();

    // 1. Criar o Gerenciador de Scripts ANTES do Viewer
    const scriptingManager = new pdfjsViewer.PDFScriptingManager({
        eventBus,
        sandboxBundleSrc
    });

    // 2. Criar o Visualizador com suporte a Scripts
    const pdfViewer = new pdfjsViewer.PDFViewer({
        container: document.getElementById('viewerContainer'),
        eventBus: eventBus,
        renderInteractiveForms: true,
        enableScripting: true,
    });

    // Conecta o motor ao visualizador
    pdfViewer.setScriptingManager(scriptingManager);

    // Carregamento do PDF
    document.getElementById('file-input').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        document.getElementById('file-info').innerText = "Iniciando motor de cálculos...";
        currentPdfBytes = await file.arrayBuffer();

        const loadingTask = pdfjsLib.getDocument({
            data: new Uint8Array(currentPdfBytes),
            enableJavaScript: true 
        });

        const pdfDocument = await loadingTask.promise;
        
        // Renderiza as páginas
        pdfViewer.setDocument(pdfDocument);
        
        // Ativa o motor de JavaScript (AcroJS) da sua ficha
        await scriptingManager.setDocument(pdfDocument);

        document.getElementById('js-status').innerText = "ATIVO (Cálculos prontos)";
        document.getElementById('js-status').style.color = "#81c995";
        document.getElementById('save-btn').style.display = 'inline-block';
        document.getElementById('file-info').innerText = file.name;
    });

    // Clique no campo de imagem
    document.getElementById('viewerContainer').addEventListener('click', (e) => {
        const target = e.target;
        if (target.classList.contains('buttonWidgetAnnotation') || target.closest('.buttonWidgetAnnotation')) {
            lastClickedField = target.closest('.buttonWidgetAnnotation') || target;
            document.getElementById('img-selector').click();
        }
    });

    // Inserção visual imediata da imagem
    document.getElementById('img-selector').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file || !lastClickedField) return;

        const imgUrl = URL.createObjectURL(file);
        const imgBuffer = await file.arrayBuffer();
        const rect = lastClickedField.getBoundingClientRect();
        const pageContainer = lastClickedField.closest('.page');

        if (pageContainer) {
            const visualImg = document.createElement('img');
            visualImg.src = imgUrl;
            visualImg.className = 'instant-img';
            visualImg.style.width = rect.width + 'px';
            visualImg.style.height = rect.height + 'px';
            
            const pageRect = pageContainer.getBoundingClientRect();
            visualImg.style.left = (rect.left - pageRect.left) + 'px';
            visualImg.style.top = (rect.top - pageRect.top) + 'px';
            pageContainer.appendChild(visualImg);

            imagesToProcess.push({
                buffer: imgBuffer,
                type: file.type,
                widthPct: rect.width / pageContainer.clientWidth,
                heightPct: rect.height / pageContainer.clientHeight,
                leftPct: (rect.left - pageRect.left) / pageContainer.clientWidth,
                topPct: (rect.top - pageRect.top) / pageContainer.clientHeight
            });
        }
    });

    // Salvar PDF com programação preservada e imagens novas
    document.getElementById('save-btn').addEventListener('click', async () => {
        const { PDFDocument } = PDFLib;
        document.getElementById('file-info').innerText = "Compilando PDF...";
        
        const pdfDoc = await PDFDocument.load(currentPdfBytes);
        const page = pdfDoc.getPages()[0]; 
        const { width, height } = page.getSize();

        for (const imgData of imagesToProcess) {
            let embeddedImage = (imgData.type === 'image/png') 
                ? await pdfDoc.embedPng(imgData.buffer) 
                : await pdfDoc.embedJpg(imgData.buffer);

            const imgW = imgData.widthPct * width;
            const imgH = imgData.heightPct * height;
            const imgX = imgData.leftPct * width;
            const imgY = height - (imgData.topPct * height) - imgH;

            page.drawImage(embeddedImage, { x: imgX, y: imgY, width: imgW, height: imgH });
        }

        const finalBytes = await pdfDoc.save();
        const blob = new Blob([finalBytes], { type: "application/pdf" });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = "Ficha_Com_Calculos.pdf";
        link.click();
        document.getElementById('file-info').innerText = "Concluído!";
    });
</script>

</body>
</html>
