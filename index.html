<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Visualizador com Cálculos Ativos</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    
    <style>
        body { margin: 0; background-color: #525659; font-family: sans-serif; overflow: hidden; }
        .toolbar { 
            position: absolute; top: 0; left: 0; right: 0; height: 50px; 
            background: #2b2b2b; display: flex; align-items: center; 
            padding: 0 20px; color: white; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.5); 
        }
        .btn { background: #0078d4; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-right: 10px; }
        #viewerContainer { position: absolute; top: 50px; bottom: 0; left: 0; right: 0; overflow: auto; }
        .pdfViewer .page { margin: 15px auto; position: relative; background: white; }
        .instant-img { position: absolute; z-index: 99; pointer-events: none; object-fit: cover; }
        #status { font-size: 13px; color: #4db8ff; font-weight: bold; }
    </style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="file-input" accept="application/pdf" style="display:none">
    <button class="btn" onclick="document.getElementById('file-input').click()">📂 Abrir sua Ficha</button>
    <button class="btn" id="save-btn" style="background:#16a34a; display:none;">💾 Baixar PDF</button>
    <span id="status">Aguardando arquivo...</span>
</div>

<input type="file" id="img-selector" accept="image/*" style="display:none">

<div id="viewerContainer">
    <div id="viewer" class="pdfViewer"></div>
</div>

<script>
    const pdfjsLib = window['pdfjs-dist/build/pdf'];
    const pdfjsViewer = window['pdfjs-dist/web/pdf_viewer'];
    
    // Configurações cruciais para rodar PROGRAMAÇÃO de PDF
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    
    // Este é o motor que traduz sua programação do Acrobat para o Navegador
    const sandboxBundleSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.sandbox.external.min.js';

    let currentPdfBytes = null;
    let imagesToProcess = [];
    const eventBus = new pdfjsViewer.EventBus();

    // Inicializa o visualizador focado em interatividade
    const pdfViewer = new pdfjsViewer.PDFViewer({
        container: document.getElementById('viewerContainer'),
        eventBus: eventBus,
        renderInteractiveForms: true,
        enableScripting: true, // LIGA A PROGRAMAÇÃO DOS CAMPOS
        sandboxBundleSrc: sandboxBundleSrc
    });

    // Escuta quando o PDF terminar de carregar os scripts
    eventBus.on('pagesinit', () => {
        document.getElementById('status').innerText = "Cálculos e Programação Ativados!";
    });

    document.getElementById('file-input').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        currentPdfBytes = await file.arrayBuffer();
        const loadingTask = pdfjsLib.getDocument({
            data: new Uint8Array(currentPdfBytes),
            enableJavaScript: true // HABILITA O JAVASCRIPT INTERNO
        });
        
        const pdfDocument = await loadingTask.promise;
        pdfViewer.setDocument(pdfDocument);
        document.getElementById('save-btn').style.display = 'block';
    });

    // Lógica rápida para a imagem
    document.getElementById('viewerContainer').addEventListener('click', (e) => {
        const target = e.target;
        if (target.classList.contains('buttonWidgetAnnotation') || target.closest('.buttonWidgetAnnotation')) {
            window.lastField = target.closest('.buttonWidgetAnnotation') || target;
            document.getElementById('img-selector').click();
        }
    });

    document.getElementById('img-selector').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file || !window.lastField) return;

        const rect = window.lastField.getBoundingClientRect();
        const pageContainer = window.lastField.closest('.page');
        const imgUrl = URL.createObjectURL(file);
        const imgBuffer = await file.arrayBuffer();

        const visualImg = document.createElement('img');
        visualImg.src = imgUrl;
        visualImg.className = 'instant-img';
        visualImg.style.width = rect.width + 'px';
        visualImg.style.height = rect.height + 'px';
        
        const pageRect = pageContainer.getBoundingClientRect();
        visualImg.style.left = (rect.left - pageRect.left) + 'px';
        visualImg.style.top = (rect.top - pageRect.top) + 'px';
        pageContainer.appendChild(visualImg);

        imagesToProcess.push({
            buffer: imgBuffer, type: file.type,
            w: rect.width / pageContainer.clientWidth,
            h: rect.height / pageContainer.clientHeight,
            x: (rect.left - pageRect.left) / pageContainer.clientWidth,
            y: (rect.top - pageRect.top) / pageContainer.clientHeight
        });
    });

    // Salvar
    document.getElementById('save-btn').addEventListener('click', async () => {
        const pdfDoc = await PDFLib.PDFDocument.load(currentPdfBytes);
        const page = pdfDoc.getPages()[0];
        const { width, height } = page.getSize();

        for (const imgData of imagesToProcess) {
            const img = imgData.type === 'image/png' ? await pdfDoc.embedPng(imgData.buffer) : await pdfDoc.embedJpg(imgData.buffer);
            page.drawImage(img, {
                x: imgData.x * width,
                y: height - (imgData.y * height) - (imgData.h * height),
                width: imgData.w * width, height: imgData.h * height
            });
        }

        const finalBytes = await pdfDoc.save();
        const link = document.createElement('a');
        link.href = URL.createObjectURL(new Blob([finalBytes], {type: 'application/pdf'}));
        link.download = "ficha_calculada.pdf";
        link.click();
    });
</script>

</body>
</html>
