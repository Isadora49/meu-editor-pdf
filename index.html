<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de DF Pro</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>
    <div class="controls">
        <h2>Adicionar Campo de Imagem</h2>
        <div class="upload-area">
            <input type="file" id="uploadPdf" accept="application/pdf">
        </div>
        <button id="downloadBtn" disabled>Baixar PDF Modificado</button>
        <p id="status">Aguardando arquivo...</p>
    </div>

    <div class="canvas-container">
        <canvas id="pdfCanvas"></canvas>
    </div>

    <script src="script.js"></script>
</body>
</html>
