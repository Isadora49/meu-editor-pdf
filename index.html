<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Meu Visualizador de PDF Editável</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">
    
    <style>
        :root { --edge-bg: #323639; --canvas-bg: #525659; }
        body { margin: 0; background-color: var(--canvas-bg); font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* Barra superior estilo Edge/Chrome */
        .toolbar { 
            background-color: var(--edge-bg); height: 48px; display: flex; 
            align-items: center; padding: 0 20px; color: white; box-shadow: 0 2px 5px rgba(0,0,0,0.4); z-index: 100;
        }
        .btn {
            background: #4a4d51; border: none; color: white; padding: 6px 12px; 
            border-radius: 4px; cursor: pointer; margin-right: 10px; font-size: 13px;
        }
        .btn:hover { background: #5c5f64; }

        /* Área do PDF */
        #viewerContainer { flex: 1; overflow: auto; position: relative; display: flex; justify-content: center; padding: 20px 0; }
        .pdfViewer .page { margin-bottom: 20px; position: relative; background-color: white; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        
        /* Ajuste fino para os campos ficarem visíveis */
        .annotationLayer input, .annotationLayer textarea, .annotationLayer select {
            background-color: rgba(0, 50, 255, 0.1) !important;
            border: 1px solid transparent !important;
        }
        .annotationLayer input:focus { background-color: white !important; border: 1px solid #0078d4 !important; }
    </style>
</head>
<body>

    <div class="toolbar">
        <input type="file" id="file-input" accept="application/pdf" style="display:none">
        <button class="btn" onclick="document.getElementById('file-input').click()">📂 Abrir Ficha</button>
        <span id="file-name" style="font-size: 13px; opacity: 0.8;">Nenhum arquivo aberto</span>
        <div style="flex-grow: 1;"></div>
        <button class="btn" onclick="window.print()">🖨️ Imprimir / Salvar</button>
    </div>

    <div id="viewerContainer">
        <div id="viewer" class="pdfViewer"></div>
    </div>

    <script>
        const { pdfjsLib } = globalThis;
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const container = document.getElementById('viewerContainer');
        const viewer = document.getElementById('viewer');

        document.getElementById('file-input').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('file-name').innerText = file.name;

            const arrayBuffer = await file.arrayBuffer();
            const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
            const pdfDoc = await loadingTask.promise;

            viewer.innerHTML = ''; // Limpa o anterior

            // Renderiza todas as páginas
            for (let i = 1; i <= pdfDoc.numPages; i++) {
                const page = await pdfDoc.getPage(i);
                renderPage(page);
            }
        });

        async function renderPage(page) {
            const viewport = page.getViewport({ scale: 1.5 });
            
            // Criar elementos da página
            const pageDiv = document.createElement('div');
            pageDiv.className = 'page';
            pageDiv.style.width = `${viewport.width}px`;
            pageDiv.style.height = `${viewport.height}px`;
            viewer.appendChild(pageDiv);

            // 1. Renderizar o Canvas (A imagem do PDF)
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.height = viewport.height;
            canvas.width = viewport.width;
            pageDiv.appendChild(canvas);
            await page.render({ canvasContext: context, viewport }).promise;

            // 2. Renderizar a Annotation Layer (OS CAMPOS EDITÁVEIS)
            const annotationLayerDiv = document.createElement('div');
            annotationLayerDiv.className = 'annotationLayer';
            pageDiv.appendChild(annotationLayerDiv);

            const annotations = await page.getAnnotations();
            pdfjsLib.AnnotationLayer.render({
                viewport: viewport.clone({ dontFlip: true }),
                div: annotationLayerDiv,
                annotations: annotations,
                page: page,
                renderInteractiveForms: true // O SEGREDO ESTÁ AQUI
            });
        }
    </script>
</body>
</html>
