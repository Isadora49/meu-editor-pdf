<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Visualizador de PDF - Formulários Ativos</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

    <style>
        :root { --toolbar-bg: #323639; --viewer-bg: #525659; }
        body { margin: 0; padding: 0; background-color: var(--viewer-bg); font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        .toolbar { 
            position: absolute; top: 0; left: 0; right: 0; height: 48px; 
            background-color: var(--toolbar-bg); display: flex; align-items: center; 
            padding: 0 15px; color: white; box-shadow: 0 2px 5px rgba(0,0,0,0.4); z-index: 100;
        }
        
        .btn-edge {
            background: transparent; border: none; color: white; padding: 8px 12px; cursor: pointer;
            border-radius: 4px; font-size: 13px; font-weight: 500; transition: 0.2s;
        }
        .btn-edge:hover { background: rgba(255,255,255,0.1); }
        .btn-primary { background: #0078d4; margin-left: auto; font-weight: bold; }
        .btn-primary:hover { background: #106ebe; }

        /* Container que o pdf_viewer precisa */
        #viewerContainer {
            position: absolute; top: 48px; bottom: 0; left: 0; right: 0;
            overflow: auto;
        }
        
        /* Ajuste de sombra das páginas */
        .page { box-shadow: 0 4px 10px rgba(0,0,0,0.5); margin: 20px auto; border-radius: 2px; }
    </style>
</head>
<body>

    <div class="toolbar">
        <input type="file" id="file-input" accept="application/pdf" style="display:none">
        <button class="btn-edge" onclick="document.getElementById('file-input').click()">📂 Abrir Ficha</button>
        <span id="file-name" style="margin-left: 15px; font-size: 13px; color: #ccc;">Nenhum arquivo aberto</span>
        
        <button class="btn-edge btn-primary" id="save-btn" style="display:none">📥 Salvar e Baixar</button>
    </div>

    <div id="viewerContainer">
        <div id="viewer" class="pdfViewer"></div>
    </div>

    <script>
        // Configuração dos Workers e Bibliotecas
        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        const pdfjsViewer = window['pdfjs-dist/web/pdf_viewer'];
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let currentPdfBytes = null;

        // 1. Inicializa o EventBus (Necessário para os formulários se comunicarem com a tela)
        const eventBus = new pdfjsViewer.EventBus();

        // 2. Inicializa o Visualizador Profissional Completo
        const pdfViewer = new pdfjsViewer.PDFViewer({
            container: document.getElementById('viewerContainer'),
            eventBus: eventBus,
            renderInteractiveForms: true, // HABILITA OS CAMPOS EDITÁVEIS
            enableScripting: true         // Habilita cálculos JavaScript internos do PDF
        });

        // 3. Carregar o PDF quando o usuário escolher o arquivo
        document.getElementById('file-input').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('file-name').innerText = file.name;
            currentPdfBytes = await file.arrayBuffer();

            // Lê o documento
            const loadingTask = pdfjsLib.getDocument(currentPdfBytes);
            const pdfDocument = await loadingTask.promise;
            
            // Passa o documento para o Viewer renderizar (Páginas, Texto e Formulários)
            pdfViewer.setDocument(pdfDocument);
            document.getElementById('save-btn').style.display = 'block';
        });

        // 4. Salvar (Neste momento, fará o download do PDF original. A captura dos novos dados requer PDF-Lib)
        document.getElementById('save-btn').addEventListener('click', () => {
            alert("Campos de formulário ativos! A lógica de capturar as mudanças preenchidas e injetar no PDF-Lib será o próximo passo.");
            // O código de salvamento avançado entrará aqui depois.
        });
    </script>
</body>
</html>
