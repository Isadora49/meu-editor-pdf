<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Editor de Ficha - Versão Blindada</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: #202124; overflow: hidden; display: flex; flex-direction: column; }
        
        .toolbar { 
            height: 60px; background: #323639; display: flex; align-items: center; 
            padding: 0 20px; color: white; z-index: 100; flex-shrink: 0;
        }
        
        .btn { 
            background: #8ab4f8; color: #202124; border: none; padding: 10px 20px; 
            border-radius: 4px; cursor: pointer; font-weight: bold; margin-right: 15px;
        }

        /* Container forçado para ser visível */
        #viewerContainer { 
            flex: 1; 
            position: relative; 
            overflow: auto; 
            background: #525659;
            width: 100%;
            height: calc(100vh - 60px);
        }

        .pdfViewer .page { margin: 20px auto; box-shadow: 0 4px 20px rgba(0,0,0,0.5); border: none; }
        .instant-img { position: absolute; z-index: 99; pointer-events: none; object-fit: cover; }
        #msg { margin-left: auto; font-size: 13px; color: #81c995; }
    </style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="file-input" accept="application/pdf" style="display:none">
    <button class="btn" onclick="document.getElementById('file-input').click()">📂 Carregar Ficha</button>
    <button class="btn" id="save-btn" style="display:none; background: #81c995;">💾 Salvar</button>
    <span id="msg">Aguardando PDF...</span>
</div>

<input type="file" id="img-selector" accept="image/*" style="display:none">

<div id="viewerContainer">
    <div id="viewer" class="pdfViewer"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

<script>
    const pdfjsLib = window['pdfjs-dist/build/pdf'];
    const pdfjsViewer = window['pdfjs-dist/web/pdf_viewer'];

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const sandboxBundleSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.sandbox.external.min.js';

    let currentPdfBytes = null;
    let imagesToProcess = [];
    let lastClickedField = null;

    const eventBus = new pdfjsViewer.EventBus();

    // Gerenciador de Scripts para ler sua programação
    const scriptingManager = new pdfjsViewer.PDFScriptingManager({
        eventBus,
        sandboxBundleSrc
    });

    const pdfViewer = new pdfjsViewer.PDFViewer({
        container: document.getElementById('viewerContainer'),
        eventBus: eventBus,
        renderInteractiveForms: true,
        enableScripting: true
    });

    pdfViewer.setScriptingManager(scriptingManager);

    document.getElementById('file-input').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        document.getElementById('msg').innerText = "Abrindo...";
        const arrayBuffer = await file.arrayBuffer();
        currentPdfBytes = new Uint8Array(arrayBuffer);

        // Configuração de carregamento robusta
        const loadingTask = pdfjsLib.getDocument({
            data: currentPdfBytes,
            enableJavaScript: true
        });

        try {
            const pdfDocument = await loadingTask.promise;
            
            // Força a renderização
            await pdfViewer.setDocument(pdfDocument);
            
            // Ativa os scripts após a renderização
            scriptingManager.setDocument(pdfDocument);
            
            document.getElementById('save-btn').style.display = 'inline-block';
            document.getElementById('msg').innerText = "✓ Ficha Ativa";
        } catch (err) {
            console.error(err);
            alert("O PDF não pôde ser aberto. Verifique se o arquivo não está corrompido.");
        }
    });

    // Clique para Imagem
    document.getElementById('viewerContainer').addEventListener('click', (e) => {
        const target = e.target;
        if (target.classList.contains('buttonWidgetAnnotation') || target.closest('.buttonWidgetAnnotation')) {
            lastClickedField = target.closest('.buttonWidgetAnnotation') || target;
            document.getElementById('img-selector').click();
        }
    });

    document.getElementById('img-selector').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file || !lastClickedField) return;

        const imgUrl = URL.createObjectURL(file);
        const imgBuffer = await file.arrayBuffer();
        const rect = lastClickedField.getBoundingClientRect();
        const pageContainer = lastClickedField.closest('.page');

        if (pageContainer) {
            const visualImg = document.createElement('img');
            visualImg.src = imgUrl;
            visualImg.className = 'instant-img';
            visualImg.style.width = rect.width + 'px';
            visualImg.style.height = rect.height + 'px';
            
            const pageRect = pageContainer.getBoundingClientRect();
            visualImg.style.left = (rect.left - pageRect.left) + 'px';
            visualImg.style.top = (rect.top - pageRect.top) + 'px';
            pageContainer.appendChild(visualImg);

            imagesToProcess.push({
                buffer: imgBuffer,
                type: file.type,
                widthPct: rect.width / pageContainer.clientWidth,
                heightPct: rect.height / pageContainer.clientHeight,
                leftPct: (rect.left - pageRect.left) / pageContainer.clientWidth,
                topPct: (rect.top - pageRect.top) / pageContainer.clientHeight
            });
        }
    });

    document.getElementById('save-btn').addEventListener('click', async () => {
        const pdfDoc = await PDFLib.PDFDocument.load(currentPdfBytes);
        const page = pdfDoc.getPages()[0];
        const { width, height } = page.getSize();

        for (const img of imagesToProcess) {
            const emb = img.type === 'image/png' ? await pdfDoc.embedPng(img.buffer) : await pdfDoc.embedJpg(img.buffer);
            page.drawImage(emb, {
                x: img.leftPct * width,
                y: height - (img.topPct * height) - (img.heightPct * height),
                width: img.widthPct * width,
                height: img.heightPct * height
            });
        }

        const bytes = await pdfDoc.save();
        const link = document.createElement('a');
        link.href = URL.createObjectURL(new Blob([bytes], {type: 'application/pdf'}));
        link.download = "ficha_calculada.pdf";
        link.click();
    });
</script>

</body>
</html>
