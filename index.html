<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Editor de Ficha Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    
    <style>
        body { margin: 0; background-color: #525659; font-family: sans-serif; overflow: hidden; }
        .toolbar { height: 48px; background: #323639; display: flex; align-items: center; padding: 0 20px; color: white; z-index: 100; position: relative; }
        #viewerContainer { position: absolute; top: 48px; bottom: 0; left: 0; right: 0; overflow: auto; }
        .pdfViewer .page { margin: 10px auto; box-shadow: 0 0 8px rgba(0,0,0,0.5); border: none; }
        .btn { background: #0078d4; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-right: 10px; }
        #loading-msg { font-size: 12px; color: #ffeb3b; display: none; }
    </style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="file-input" accept="application/pdf" style="display:none">
    <button class="btn" onclick="document.getElementById('file-input').click()">📂 Abrir PDF</button>
    <button class="btn" id="save-btn" style="background:#16a34a">💾 Salvar</button>
    <span id="loading-msg">Processando...</span>
</div>

<input type="file" id="img-selector" accept="image/*" style="display:none">

<div id="viewerContainer">
    <div id="viewer" class="pdfViewer"></div>
</div>

<script>
    const pdfjsLib = window['pdfjs-dist/build/pdf'];
    const pdfjsViewer = window['pdfjs-dist/web/pdf_viewer'];
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // Arquivos necessários para os CÁLCULOS funcionarem
    const sandboxBundleSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.sandbox.external.min.js';

    let currentPdfBytes = null;
    const eventBus = new pdfjsViewer.EventBus();

    const pdfViewer = new pdfjsViewer.PDFViewer({
        container: document.getElementById('viewerContainer'),
        eventBus: eventBus,
        renderInteractiveForms: true,
        enableScripting: true, // ATIVA CÁLCULOS
        sandboxBundleSrc: sandboxBundleSrc
    });

    // Monitora mudanças nos campos para forçar cálculos
    eventBus.on('pagerendered', function () {
        document.getElementById('loading-msg').style.display = 'none';
    });

    document.getElementById('file-input').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        currentPdfBytes = await file.arrayBuffer();
        loadPDF(currentPdfBytes);
    });

    async function loadPDF(bytes) {
        const loadingTask = pdfjsLib.getDocument({
            data: bytes,
            enableJavaScript: true // ESSENCIAL PARA CÁLCULOS
        });
        const pdfDocument = await loadingTask.promise;
        pdfViewer.setDocument(pdfDocument);
    }

    // LÓGICA DE IMAGEM ULTRA RÁPIDA
    document.getElementById('viewerContainer').addEventListener('click', (e) => {
        const target = e.target;
        if (target.classList.contains('buttonWidgetAnnotation') || target.closest('.buttonWidgetAnnotation')) {
            document.getElementById('img-selector').click();
        }
    });

    document.getElementById('img-selector').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        document.getElementById('loading-msg').style.display = 'inline';
        const imgBytes = await file.arrayBuffer();
        const pdfDoc = await PDFLib.PDFDocument.load(currentPdfBytes);
        const page = pdfDoc.getPages()[0];

        const img = file.type === 'image/png' ? await pdfDoc.embedPng(imgBytes) : await pdfDoc.embedJpg(imgBytes);

        // Inserção automática (Exemplo na área da foto comum em fichas)
        page.drawImage(img, { x: 445, y: 550, width: 110, height: 130 }); 

        currentPdfBytes = await pdfDoc.save();
        await loadPDF(currentPdfBytes); // Atualiza a tela
    });

    document.getElementById('save-btn').addEventListener('click', () => {
        const blob = new Blob([currentPdfBytes], { type: "application/pdf" });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = "ficha_editada.pdf";
        link.click();
    });
</script>

</body>
</html>
