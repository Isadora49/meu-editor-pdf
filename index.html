<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de PDF Portátil</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    
    <style>
        :root { --primary: #2563eb; --success: #16a34a; --bg: #0f172a; }
        body { font-family: sans-serif; background-color: var(--bg); color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        .controls { background: #1e293b; padding: 20px; border-radius: 12px; width: 100%; max-width: 800px; text-align: center; margin-bottom: 20px; border: 1px solid #334155; }
        .btn-group { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 15px; }
        .btn { padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; background: var(--primary); color: white; transition: 0.2s; }
        .btn-success { background: var(--success); }
        .btn:disabled { background: #475569; cursor: not-allowed; }
        .canvas-container { border: 2px dashed #475569; border-radius: 8px; overflow: auto; background: #334155; cursor: crosshair; }
        canvas { background: white; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        #status { font-size: 0.9rem; color: #94a3b8; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="controls">
        <h2>Editor de PDF: Posicionador de Imagem</h2>
        <div class="btn-group">
            <input type="file" id="uploadPdf" accept="application/pdf" hidden>
            <label for="uploadPdf" class="btn">1. Selecionar PDF</label>

            <input type="file" id="uploadImage" accept="image/png, image/jpeg" hidden>
            <label for="uploadImage" class="btn" id="labelImage">2. Selecionar Imagem</label>

            <button id="downloadBtn" class="btn btn-success" disabled>3. Gerar e Baixar PDF</button>
        </div>
        <p id="status">Aguardando arquivos...</p>
    </div>

    <div class="canvas-container" id="container">
        <canvas id="pdfCanvas"></canvas>
    </div>

    <script>
        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        let pdfBytes = null;
        let imageBytes = null;
        let imageType = '';
        let clickX = 0, clickY = 0;
        const pdfScale = 1.5;
        const boxSize = 100;

        const canvas = document.getElementById('pdfCanvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('status');
        const downloadBtn = document.getElementById('downloadBtn');

        // Carregar PDF
        document.getElementById('uploadPdf').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            pdfBytes = await file.arrayBuffer();
            renderPDF(pdfBytes);
            statusText.innerText = "PDF Carregado. Agora selecione a imagem.";
        });

        // Carregar Imagem
        document.getElementById('uploadImage').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            imageType = file.type;
            imageBytes = await file.arrayBuffer();
            statusText.innerText = "Imagem pronta! Clique no PDF para posicionar.";
            document.getElementById('labelImage').innerText = "✓ Imagem Selecionada";
        });

        async function renderPDF(data) {
            const loadingTask = pdfjsLib.getDocument({ data: new Uint8Array(data) });
            const pdf = await loadingTask.promise;
            const page = await pdf.getPage(1);
            const viewport = page.getViewport({ scale: pdfScale });
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            await page.render({ canvasContext: ctx, viewport: viewport }).promise;
        }

        canvas.addEventListener('click', (e) => {
            if (!pdfBytes || !imageBytes) return;
            const rect = canvas.getBoundingClientRect();
            clickX = e.clientX - rect.left;
            clickY = e.clientY - rect.top;

            renderPDF(pdfBytes).then(() => {
                ctx.strokeStyle = "#2563eb";
                ctx.lineWidth = 3;
                ctx.strokeRect(clickX, clickY, boxSize, boxSize);
                statusText.innerText = "Posição marcada! Clique em Gerar e Baixar.";
                downloadBtn.disabled = false;
            });
        });

        downloadBtn.addEventListener('click', async () => {
            try {
                const { PDFDocument } = PDFLib;
                const pdfDoc = await PDFDocument.load(pdfBytes);
                const page = pdfDoc.getPages()[0];
                const { height } = page.getSize();

                // Converter coordenadas do canvas para PDF
                const finalX = clickX / pdfScale;
                const finalY = (canvas.height - (clickY + boxSize)) / pdfScale;
                const finalSize = boxSize / pdfScale;

                let img;
                if (imageType === 'image/png') img = await pdfDoc.embedPng(imageBytes);
                else img = await pdfDoc.embedJpg(imageBytes);

                page.drawImage(img, { x: finalX, y: finalY, width: finalSize, height: finalSize });

                const savedBytes = await pdfDoc.save();
                const blob = new Blob([savedBytes], { type: "application/pdf" });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = "pdf_editado.pdf";
                link.click();
                statusText.innerText = "PDF gerado com sucesso!";
            } catch (err) {
                alert("Erro ao gerar PDF: " + err.message);
            }
        });
    </script>
</body>
</html>
