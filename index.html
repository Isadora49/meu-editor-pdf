<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>PDF Form Viewer - Estilo Edge</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        :root { --bg-viewer: #525659; --toolbar: #323639; --field-blue: rgba(0, 102, 255, 0.1); }
        body { margin: 0; background: var(--bg-viewer); font-family: 'Segoe UI', sans-serif; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        
        /* Toolbar estilo Edge */
        .toolbar { height: 48px; background: var(--toolbar); display: flex; align-items: center; padding: 0 20px; color: white; box-shadow: 0 2px 5px rgba(0,0,0,0.3); z-index: 100; }
        .toolbar h1 { font-size: 14px; font-weight: 400; flex-grow: 1; margin: 0; }
        .btn-edge { background: transparent; border: none; color: white; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-size: 13px; transition: 0.2s; }
        .btn-edge:hover { background: rgba(255,255,255,0.1); }
        .btn-primary { background: #0078d4; }
        .btn-primary:hover { background: #106ebe; }

        /* Área do PDF */
        .viewport { flex-grow: 1; overflow: auto; display: flex; justify-content: center; padding: 40px 0; position: relative; }
        #pdf-wrapper { position: relative; background: white; box-shadow: 0 0 20px rgba(0,0,0,0.4); }
        canvas { display: block; }

        /* Camada de Campos Editáveis */
        .annotation-layer { position: absolute; top: 0; left: 0; pointer-events: none; }
        .form-field { 
            position: absolute; pointer-events: auto; 
            border: 1px solid transparent; background: var(--field-blue); 
            box-sizing: border-box; transition: 0.2s;
        }
        .form-field:hover { background: rgba(0, 102, 255, 0.2); border: 1px solid #0066ff; }
        .form-field input, .form-field textarea { 
            width: 100%; height: 100%; border: none; background: transparent; 
            font-size: inherit; padding: 2px; outline: none;
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <h1>Visualizador de Fichas Editáveis</h1>
        <input type="file" id="file-input" accept="application/pdf" hidden>
        <button class="btn-edge" onclick="document.getElementById('file-input').click()">Abrir Arquivo</button>
        <button id="save-btn" class="btn-edge btn-primary" style="display:none">Salvar e Baixar</button>
    </div>

    <div class="viewport">
        <div id="pdf-wrapper">
            <canvas id="pdf-canvas"></canvas>
            <div id="annotation-layer" class="annotation-layer"></div>
        </div>
    </div>

    <script>
        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        let pdfDoc = null;
        let pdfBytes = null;
        let scale = 1.5; // Ajuste de zoom

        document.getElementById('file-input').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            pdfBytes = await file.arrayBuffer();
            loadPDF(pdfBytes);
        });

        async function loadPDF(bytes) {
            // Limpa visualização anterior
            document.getElementById('annotation-layer').innerHTML = '';
            
            const loadingTask = pdfjsLib.getDocument({ data: new Uint8Array(bytes) });
            const pdf = await loadingTask.promise;
            const page = await pdf.getPage(1);
            
            const viewport = page.getViewport({ scale });
            const canvas = document.getElementById('pdf-canvas');
            const wrapper = document.getElementById('pdf-wrapper');
            
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            wrapper.style.width = viewport.width + 'px';
            wrapper.style.height = viewport.height + 'px';

            const renderContext = { canvasContext: canvas.getContext('2d'), viewport: viewport };
            await page.render(renderContext).promise;

            // Agora vamos reconhecer os campos editáveis usando PDF-LIB
            const fullPdf = await PDFLib.PDFDocument.load(bytes);
            const form = fullPdf.getForm();
            const fields = form.getFields();

            fields.forEach(field => {
                const name = field.getName();
                const widgets = field.acroField.getWidgets();
                
                widgets.forEach(widget => {
                    const rect = widget.getRectangle();
                    createHTMLField(name, rect, viewport.height, field.constructor.name);
                });
            });

            document.getElementById('save-btn').style.display = 'block';
        }

        function createHTMLField(name, rect, pageHeight, type) {
            const container = document.getElementById('annotation-layer');
            const div = document.createElement('div');
            div.className = 'form-field';
            
            // Converte coordenadas do PDF para Pixels da tela
            div.style.left = (rect.x * scale) + 'px';
            div.style.top = (pageHeight - (rect.y + rect.height) * scale) + 'px';
            div.style.width = (rect.width * scale) + 'px';
            div.style.height = (rect.height * scale) + 'px';

            if (type === 'PDFButton') {
                // Se for um botão (campo de imagem), cria um seletor
                div.innerHTML = `<button title="Clique para Imagem" style="width:100%; height:100%; opacity:0; cursor:pointer" onclick="triggerImageUpload('${name}')"></button>`;
            } else {
                // Se for texto, cria um input real
                div.innerHTML = `<input type="text" id="field-${name}" data-name="${name}">`;
            }

            container.appendChild(div);
        }

        async function triggerImageUpload(fieldName) {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const imgBytes = await file.arrayBuffer();
                alert(`Imagem para o campo "${fieldName}" carregada! Clique em Salvar para aplicar.`);
                window.lastImage = { fieldName, imgBytes, type: file.type };
            };
            input.click();
        }

        document.getElementById('save-btn').addEventListener('click', async () => {
            const fullPdf = await PDFLib.PDFDocument.load(pdfBytes);
            const form = fullPdf.getForm();

            // Pega todos os valores digitados nos campos de texto
            const inputs = document.querySelectorAll('.form-field input');
            inputs.forEach(input => {
                const name = input.getAttribute('data-name');
                const field = form.getTextField(name);
                field.setText(input.value);
            });

            // Insere a imagem se houver uma selecionada
            if (window.lastImage) {
                const button = form.getButton(window.lastImage.fieldName);
                const img = (window.lastImage.type === 'image/png') 
                    ? await fullPdf.embedPng(window.lastImage.imgBytes) 
                    : await fullPdf.embedJpg(window.lastImage.imgBytes);
                button.setImage(img);
            }

            const result = await fullPdf.save();
            const blob = new Blob([result], { type: "application/pdf" });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = "ficha_preenchida.pdf";
            link.click();
        });
    </script>
</body>
</html>
