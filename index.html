<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de PDF - Adicionar Campo</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
</head>
<body>
    <div class="controls">
        <h2>Adicionar Campo de Imagem no PDF</h2>
        <input type="file" id="uploadPdf" accept="application/pdf">
        <button id="downloadBtn" disabled>Baixar PDF Modificado</button>
        <p id="status">Faça o upload de um PDF para começar. Clique na página para definir a posição do campo.</p>
    </div>

    <div class="canvas-container">
        <canvas id="pdfCanvas"></canvas>
    </div>

    <script src="script.js"></script>
</body>
</html>
