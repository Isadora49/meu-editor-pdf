<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Visualizador de PDF Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        /* Estilo para parecer o visualizador nativo do Chrome */
        body { margin: 0; background-color: #525659; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
        
        .toolbar { 
            height: 56px; background-color: #323639; display: flex; align-items: center; 
            padding: 0 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.3); z-index: 10;
        }

        .toolbar h1 { color: white; font-size: 14px; flex-grow: 1; font-weight: normal; }

        .btn-tool {
            background: none; border: none; color: white; padding: 8px 15px; cursor: pointer;
            border-radius: 4px; transition: background 0.2s; font-size: 13px; margin-left: 10px;
            display: flex; align-items: center; gap: 5px;
        }

        .btn-tool:hover { background-color: rgba(255,255,255,0.1); }
        .btn-tool.primary { background-color: #8ab4f8; color: #202124; font-weight: bold; }

        .viewer-container { flex-grow: 1; overflow: auto; display: flex; justify-content: center; padding: 20px; }
        
        #pdf-render-area { background-color: white; box-shadow: 0 0 15px rgba(0,0,0,0.5); position: relative; cursor: crosshair; }
        
        canvas { display: block; }

        /* Esconder inputs reais */
        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <div class="toolbar">
        <h1>Editor de PDF - Interface Nativa</h1>
        
        <input type="file" id="load-pdf" accept="application/pdf">
        <button class="btn-tool" onclick="document.getElementById('load-pdf').click()">📂 Abrir Arquivo</button>
        
        <input type="file" id="load-img" accept="image/*">
        <button id="btn-img" class="btn-tool" onclick="document.getElementById('load-img').click()" style="display:none">🖼️ Selecionar Imagem</button>
        
        <button id="btn-save" class="btn-tool primary" style="display:none">📥 Baixar PDF Editado</button>
    </div>

    <div class="viewer-container">
        <div id="pdf-render-area">
            <canvas id="main-canvas"></canvas>
        </div>
    </div>

    <script>
        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        let originalPdfBytes = null;
        let selectedImgBytes = null;
        let imgType = '';
        let posX = 0, posY = 0;
        const scale = 1.5;

        // 1. Abrir o PDF
        document.getElementById('load-pdf').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            originalPdfBytes = await file.arrayBuffer();
            renderPreview();
            document.getElementById('btn-img').style.display = 'flex';
        });

        // 2. Selecionar Imagem
        document.getElementById('load-img').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            imgType = file.type;
            selectedImgBytes = await file.arrayBuffer();
            alert("Imagem carregada! Agora clique em qualquer lugar do PDF para posicioná-la.");
        });

        async function renderPreview() {
            const loadingTask = pdfjsLib.getDocument({ data: new Uint8Array(originalPdfBytes) });
            const pdf = await loadingTask.promise;
            const page = await pdf.getPage(1);
            const viewport = page.getViewport({ scale: scale });
            
            const canvas = document.getElementById('main-canvas');
            const context = canvas.getContext('2d');
            canvas.height = viewport.height;
            canvas.width = viewport.width;

            await page.render({ canvasContext: context, viewport: viewport }).promise;
        }

        // 3. Clique para Posicionar
        document.getElementById('pdf-render-area').addEventListener('click', (e) => {
            if (!selectedImgBytes) return;

            const rect = e.currentTarget.getBoundingClientRect();
            posX = e.clientX - rect.left;
            posY = e.clientY - rect.top;

            // Desenha um feedback visual (retângulo)
            renderPreview().then(() => {
                const ctx = document.getElementById('main-canvas').getContext('2d');
                ctx.strokeStyle = '#4285f4';
                ctx.lineWidth = 2;
                ctx.strokeRect(posX, posY, 100, 100);
                ctx.fillStyle = 'rgba(66, 133, 244, 0.2)';
                ctx.fillRect(posX, posY, 100, 100);
                
                document.getElementById('btn-save').style.display = 'flex';
            });
        });

        // 4. Salvar PDF (Carimbar a imagem permanentemente)
        document.getElementById('btn-save').addEventListener('click', async () => {
            const { PDFDocument } = PDFLib;
            const pdfDoc = await PDFDocument.load(originalPdfBytes);
            const page = pdfDoc.getPages()[0];
            const { height } = page.getSize();

            const img = (imgType === 'image/png') ? await pdfDoc.embedPng(selectedImgBytes) : await pdfDoc.embedJpg(selectedImgBytes);

            // Traduz coordenadas do canvas para coordenadas do PDF (Y é invertido no PDF)
            page.drawImage(img, {
                x: posX / scale,
                y: height - ((posY + 100) / scale),
                width: 100 / scale,
                height: 100 / scale,
            });

            const savedBytes = await pdfDoc.save();
            const blob = new Blob([savedBytes], { type: "application/pdf" });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = "documento_editado.pdf";
            link.click();
        });
    </script>
</body>
</html>
