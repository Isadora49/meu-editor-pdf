<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Criador de Documento Interativo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="controls">
        <h2>Criador de Campo de Imagem Dinâmico</h2>
        <button id="generateBtn" class="btn btn-success">Gerar Documento Interativo</button>
        <p id="status">Este documento permitirá carregar imagens diretamente no navegador.</p>
    </div>

    <div class="canvas-container" id="container" style="width: 600px; height: 800px; background: white; border: 1px solid #ccc; position: relative;">
        <p style="text-align: center; color: #aaa; margin-top: 50px;">O campo de imagem aparecerá aqui</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
